server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # OHIF is a single-page app. Deep links like /viewer or /viewer?... must
    # fall back to index.html instead of returning nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
