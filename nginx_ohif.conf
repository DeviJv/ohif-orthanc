server {
    listen 80;
    server_name _;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # IMPORTANT: Ensure your certificate files are mapped to these paths in docker-compose.yml
    ssl_certificate     /etc/nginx/ssl/live/quantumtechsolution.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/quantumtechsolution.id/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 500M;

    # These headers are CRITICAL for OHIF "Basic" and "Segmented" viewers
    # they allow the use of SharedArrayBuffer which is required for volume rendering
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Proxy to the Next.js Frontend
    location / {
        proxy_pass http://frontend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSockets support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE (Server-Sent Events) support
    location /api/events {
        proxy_pass http://frontend:3001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Direct Proxy to OHIF Viewer (Avoids Mixed Content SSL errors)
    location /ohif/ {
        proxy_pass http://pacs:8042/ohif/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz"; # quantum:quantum123
        proxy_buffering off;
    }

    # Direct Proxy to DICOMweb API
    location /dicom-web/ {
        proxy_pass http://pacs:8042/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz"; # quantum:quantum123
        proxy_buffering off;
    }

    # Direct Proxy to Orthanc (for the webpage and direct API access)
    # Accessible via https://your-domain/orthanc/
    location /orthanc/ {
        proxy_pass http://pacs:8042/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Inject Orthanc authentication header to bypass prompt
        # User: quantum, Pass: quantum123 (Base64)
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        
        # To allow Orthanc to know it's being accessed via HTTPS
        proxy_set_header X-Forwarded-Host $host;
    }
}
