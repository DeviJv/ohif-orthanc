services:
  orthanc-db:
    image: postgres:15-alpine
    container_name: orthanc-db
    restart: always
    environment:
      - POSTGRES_USER=${ORTHANC_USERNAME}
      - POSTGRES_PASSWORD=${ORTHANC_PASSWORD}
      - POSTGRES_DB=orthanc
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthanc -d orthanc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pacs

  app-db:
    image: postgres:15-alpine
    container_name: app-db
    restart: always
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./app_postgres_data:/var/lib/postgresql/data
    networks:
      - pacs

  pacs:
    container_name: orthanc
    image: jodogne/orthanc-plugins
    ports:
      - 8042:8042
      - 4242:4242
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./auto-send.lua:/etc/orthanc/auto-send.lua:ro
      - ./ohif.js:/etc/orthanc/ohif.js:ro
      - ./ohif_custom.css:/etc/orthanc/ohif_custom.css:ro
      - ./orthanc_db:/var/lib/orthanc/db/
    restart: always
    depends_on:
      orthanc-db:
        condition: service_healthy
    environment:
      - FRONTEND_INTERNAL_URL=http://pacs-web:3001
    networks:
      - pacs

  frontend:
    user: root
    build:

      context: ./frontend
      dockerfile: Dockerfile
    image: quantum-pacs-frontend:latest
    container_name: pacs-web
    volumes:
      - ./logo.png:/app/public/logo.png:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dicom-router/.env:/app/dicom-router/.env
    # Port 3001 is now handled by Nginx, but keeping mapping for local access if needed
    ports:
      - 3001:3001
    environment:
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@app-db:5432/${DB_NAME}
      - AUTH_SECRET=${AUTH_SECRET}
      # Let NextAuth trust the incoming host so localhost/IP/domain access all work.
      - AUTH_TRUST_HOST=true
      - ORTHANC_URL=http://orthanc:8042
      - ORTHANC_USERNAME=${ORTHANC_USERNAME}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
      - AI_BACKEND_URL=http://ai-engine:8000
      - INTERNAL_PACS_KEY=${INTERNAL_PACS_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NEXT_PUBLIC_ORTHANC_URL=${NEXT_PUBLIC_ORTHANC_URL}
    depends_on:
      - app-db
      - pacs
    restart: always
    networks:
      - pacs

  nginx:
    image: nginx:alpine
    container_name: pacs-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logo.png:/usr/share/nginx/html/logo.png:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - ORTHANC_USERNAME=${ORTHANC_USERNAME}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
      - ORTHANC_AUTH_BASE64=${ORTHANC_AUTH_BASE64}
    networks:
      - pacs
    depends_on:
      - frontend
      - pacs
      - ohif-viewer

  ohif-viewer:
    image: ohif/app:v3.9.2
    container_name: ohif-viewer
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js
    networks:
      - pacs

  # Automated Weekly Backups (Sunday 00:00)
  orthanc-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: orthanc-backup
    restart: always
    environment:
      - POSTGRES_HOST=orthanc-db
      - POSTGRES_DB=orthanc
      - POSTGRES_USER=${ORTHANC_USERNAME}
      - POSTGRES_PASSWORD=${ORTHANC_PASSWORD}
      - SCHEDULE=0 0 * * 0
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_SUFFIX=_orthanc
    volumes:
      - ./backups:/backups
    networks:
      - pacs
    depends_on:
      orthanc-db:
        condition: service_healthy

  app-db-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: app-db-backup
    restart: always
    environment:
      - POSTGRES_HOST=app-db
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=0 0 * * 0
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_SUFFIX=_app
    volumes:
      - ./backups:/backups
    networks:
      - pacs
    depends_on:
      - app-db

  ai-engine:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
      args:
        - BUILD_TYPE=full #lite atau full ya value nya
    container_name: ai-engine
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@app-db:5432/${DB_NAME}
      - ORTHANC_URL=http://orthanc:8042
      - ORTHANC_USERNAME=${ORTHANC_USERNAME}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
      - FRONTEND_INTERNAL_URL=http://pacs-web:3001
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
    volumes:
      - ./ai_models_cache/torch:/root/.cache/torch
      - ./ai_models_cache/torchxrayvision:/root/.torchxrayvision
    depends_on:
      - app-db
      - pacs
    networks:
      - pacs
    ports:
      - "8000:8000"

  # Log Collector: Otomatis mencatat semua log container ke file logs/all.log
  log-collector:
    image: docker:cli
    container_name: log-collector
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/app/logs
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "echo '[COLLECTOR] Starting automated log capture...' > logs/all.log && docker events --filter 'type=container' --filter 'event=start' | while read event; do echo '[COLLECTOR] New container detected, refreshing log streams...'; done & docker compose logs -f -t >> logs/all.log 2>&1"]
    networks:
      - pacs

networks:
  pacs:
    external: true
