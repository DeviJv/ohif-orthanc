# Nginx Configuration for Quantum PACS
server {
    listen 80;
    server_name quantumtechsolution.id www.quantumtechsolution.id;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name quantumtechsolution.id www.quantumtechsolution.id;

    ssl_certificate     /etc/nginx/ssl/live/quantumtechsolution.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/quantumtechsolution.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    # Global Proxy Buffers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Security Headers for OHIF (CRITICAL for SharedArrayBuffer & GPU Rendering)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;


    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Serve logo directly
    location = /logo.png {
        alias /usr/share/nginx/html/logo.png;
    }

    # OHIF Viewer SPA
    location /ohif/ {
        proxy_pass http://viewer:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OHIF assets & Service Worker
    location ~* ^/(ohif/)?(app.*\.js|app.*\.css|init-service-worker\.js|.*\.wasm|manifest\.json|sw\.js|assets/.*|[0-9]+\..*\.js|[0-9]+\.css|logo\.png|app-config\.js)$ {
        proxy_pass http://viewer:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/ohif/(.*) /$1 break;
    }

    # Frontend
    location / {
        proxy_pass http://quantum-web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE
    location /api/events {
        proxy_pass http://quantum-web:3001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Legacy Redirect
    location /viewer/ {
        return 301 https://$host/ohif/viewer$is_args$args;
    }

    # Orthanc
    location /orthanc/ {
        proxy_pass http://backend:8042/;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DICOMweb
    location /dicom-web/ {
        proxy_pass http://backend:8042/dicom-web/;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WADO-URI
    location /wado {
        proxy_pass http://backend:8042/wado;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


