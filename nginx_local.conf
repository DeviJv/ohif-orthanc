server {
    listen 80;
    server_name _;

    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $frontend_url http://frontend:3001;
    set $ohif_viewer_url http://ohif-viewer:80;
    set $orthanc_url http://pacs:8042;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    location / {
        proxy_pass $frontend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/events {
        proxy_pass $frontend_url;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
    
    location /viewer/ {
        proxy_pass $ohif_viewer_url/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location ~* ^/(app.*\.js|app.*\.css|init-service-worker\.js|.*\.wasm|silent-refresh\.html|manifest\.json|sw\.js|ohif-.*|.*\.worker\.js|assets/.*|[0-9]+\..*\.js|[0-9]+\.css)$ {
        proxy_pass $ohif_viewer_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /app-config.js {
        proxy_pass $ohif_viewer_url/app-config.js;
        proxy_set_header Host $host;
    }

    location /orthanc/ohif/ {
        return 301 http://$host/viewer/dicomweb$is_args$args;
    }

    location /orthanc/ {
        proxy_pass $orthanc_url/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_set_header X-Forwarded-Host $host;
    }

    location /dicom-web/ {
        proxy_pass $orthanc_url/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
    }

    location /wado {
        proxy_pass $orthanc_url/wado;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
    }
}
