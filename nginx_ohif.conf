server {
  listen 80;
  # set client body size to 500M, this is to allow uploading of DICOMs, throws '413 request entity too large nginx' error otherwise #
  client_max_body_size 500M;

  # Inject custom CSS ke HTML OHIF untuk menyembunyikan header
  sub_filter '</head>' '<link rel="stylesheet" href="/custom.css"></head>';
  # Ganti polyfill.io yang bermasalah dengan endpoint yang aman
  sub_filter 'polyfill.io' 'polyfill-fastly.io';
  sub_filter_once off;
  sub_filter_types text/html;

  # Matikan kompresi agar sub_filter selalu bekerja dan tidak menyebabkan CORRUPTED_CONTENT
  gzip off;
  proxy_set_header Accept-Encoding "";

  # Tambah MIME type untuk ES module (.mjs) agar tidak diblokir browser
  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html htm;
    image/png               png;
    image/jpeg              jpeg jpg;
    image/svg+xml           svg;
    font/woff2              woff2;
    font/woff               woff;
    application/json        json;
  }

  # Serve custom CSS untuk menyembunyikan header OHIF
  location = /custom.css {
    root   /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }
  # Disable service worker agar tidak mencoba load dari localhost
  location = /service-worker.js {
    root   /usr/share/nginx/html;
    add_header Content-Type "application/javascript";
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri /service-worker.js;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }

  # https://book.orthanc-server.com/faq/nginx.html#nginx
  location  /orthanc/  {
    proxy_pass http://pacs:8042;
    proxy_set_header HOST $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Inject Orthanc authentication header to bypass prompt in iframe
    proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz"; 
    rewrite /orthanc(.*) $1 break;
   }
}

