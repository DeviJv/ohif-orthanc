server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # These paths are managed by Certbot on your VPS host
    ssl_certificate     /etc/nginx/ssl/live/pacs.antigravity.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/pacs.antigravity.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;

    # Required for OHIF v3 SharedArrayBuffer / volume rendering
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Next.js Frontend
    location / {
        proxy_pass http://pacs-web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE support for live notifications
    location /api/events {
        proxy_pass http://pacs-web:3001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    
    # Standalone OHIF Viewer (Unified /ohif/ path)
    location /ohif/ {
        proxy_pass http://ohif-viewer:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Required for volume rendering and SAB
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
    
    # Fallback for OHIF assets that load at root
    location ~* ^/(app.*\.js|app.*\.css|init-service-worker\.js|.*\.wasm|silent-refresh\.html|manifest\.json|sw\.js|ohif-.*|.*\.worker\.js|assets/.*|[0-9]+\..*\.js|[0-9]+\.css)$ {
        proxy_pass http://ohif-viewer:80;
        proxy_set_header Host $host;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location /app-config.js {
        proxy_pass http://ohif-viewer:80/app-config.js;
        proxy_set_header Host $host;
    }

    # Orthanc & DICOMweb
    location /orthanc/ {
        proxy_pass http://pacs:8042/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_set_header X-Forwarded-Host $host;
    }

    location /dicom-web/ {
        proxy_pass http://pacs:8042/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /wado {
        proxy_pass http://pacs:8042/wado;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
    }
}
