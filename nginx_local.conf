server {
    listen 80;
    server_name _;

    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Required for OHIF v3 SharedArrayBuffer / volume rendering
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # CORS for Port 3000 Standalone OHIF
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Next.js Frontend (Dev Mode)
    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE support for live notifications
    location /api/events {
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
    
    # Standalone OHIF Viewer Port 3000
    location /viewer/ {
        proxy_pass http://ohif-viewer:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Specific approach for OHIF assets that load at root
    location ~* ^/(app.*\.js|app.*\.css|init-service-worker\.js|.*\.wasm|silent-refresh\.html|manifest\.json|sw\.js|ohif-.*|.*\.worker\.js|assets/.*|[0-9]+\..*\.js|[0-9]+\.css)$ {
        proxy_pass http://ohif-viewer:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }

    # Standard OHIF config path
    location /app-config.js {
        proxy_pass http://ohif-viewer:80/app-config.js;
        proxy_set_header Host $host;
    }

    # Redirect old OHIF path to new Gateway Viewer
    location /orthanc/ohif/ {
        return 301 http://$host/viewer/dicomweb$is_args$args;
    }


    # Orthanc — Explorer, REST API
    location /orthanc/ {
        proxy_pass http://pacs:8042/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_set_header X-Forwarded-Host $host;
    }

    # DICOMweb — required by OHIF v3
    location /dicom-web/ {
        proxy_pass http://pacs:8042/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
    }

    # WADO-URI fallback
    location /wado {
        proxy_pass http://pacs:8042/wado;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
    }
}
