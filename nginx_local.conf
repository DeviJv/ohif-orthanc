server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # SPEED OPTIMIZATION (STABLE): Gzip for OHIF assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # SharedArrayBuffer Headers (Required for OHIF v3 stability)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Next.js Frontend
    location / {
        proxy_pass http://frontend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE support for live notifications
    location /api/events {
        proxy_pass http://frontend:3001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Orthanc — Explorer, REST API, and BUNDLED OHIF
    # ALL OHIF requests will now go through this block to Orthanc directamente.
    location /orthanc/ {
        proxy_pass http://pacs:8042/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_set_header X-Forwarded-Host $host;

        # Reinforcing security headers for the VPS
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # DICOMweb — required by OHIF v3
    location /dicom-web/ {
        proxy_pass http://pacs:8042/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";

        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # WADO-URI fallback
    location /wado {
        proxy_pass http://pacs:8042/wado;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
    }
}
