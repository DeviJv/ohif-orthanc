# Fixed Nginx Configuration for Local Development
server {
    listen 80;
    server_name _;

    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # OHIF Viewer SPA
    location /ohif/ {
        proxy_pass http://viewer:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OHIF assets - regex must come BEFORE / location
    location ~* ^/(app.*\.js|app.*\.css|init-service-worker\.js|.*\.wasm|manifest\.json|sw\.js|assets/.*|[0-9]+\..*\.js|[0-9]+\.css)$ {
        proxy_pass http://viewer:80;
        proxy_set_header Host $host;
    }

    # Frontend -LAST
    location / {
        proxy_pass http://quantum-web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSE
    location /api/events {
        proxy_pass http://quantum-web:3001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Legacy
    location /viewer/ {
        return 301 http://$host/ohif/viewer$is_args$args;
    }

    # Orthanc
    location /orthanc/ {
        proxy_pass http://backend:8042/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
        proxy_set_header X-Forwarded-Host $host;
    }

    # DICOMweb
    location /dicom-web/ {
        proxy_pass http://backend:8042/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
    }

    # WADO-URI
    location /wado {
        proxy_pass http://backend:8042/wado;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz";
    }
}
