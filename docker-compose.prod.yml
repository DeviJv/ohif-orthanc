services:
  nginx:
    volumes:
      - ./nginx_prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro  # Certbot path on VPS host
    ports:
      - "80:80"
      - "443:443"

  frontend:
    # Build-time environment variables for Next.js
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_APP_URL=https://${DOMAIN_NAME}
    environment:
      - NEXT_PUBLIC_APP_URL=https://${DOMAIN_NAME}
      - NEXT_PUBLIC_ORTHANC_URL=https://${DOMAIN_NAME}/orthanc

  # Make sure these are restarted in production
  ohif-viewer:
    restart: always

  pacs:
    restart: always
