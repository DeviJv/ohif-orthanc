services:
  orthanc-db:
    image: postgres:15-alpine
    container_name: orthanc-db
    restart: always
    environment:
      POSTGRES_USER: orthanc
      POSTGRES_PASSWORD: orthancpassword
      POSTGRES_DB: orthanc
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthanc -d orthanc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pacs

  app-db:
    image: postgres:15-alpine
    container_name: app-db
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: pacsuser
      POSTGRES_PASSWORD: pacspassword
      POSTGRES_DB: pacsweb
    volumes:
      - ./app_postgres_data:/var/lib/postgresql/data
    networks:
      - pacs

  pacs:
    container_name: orthanc
    image: jodogne/orthanc-plugins
    ports:
      - 8042:8042
      - 4242:4242
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc_db:/var/lib/orthanc/db/
    restart: always
    depends_on:
      orthanc-db:
        condition: service_healthy
    networks:
      - pacs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: quantum-pacs-frontend:latest
    container_name: pacs-web
    # Port 3001 is now handled by Nginx, but keeping mapping for local access if needed
    ports:
      - 3001:3001
    environment:
      - DATABASE_URL=postgresql://pacsuser:pacspassword@app-db:5432/pacsweb
      - AUTH_SECRET=yoursecretphrasehere
      - AUTH_TRUST_HOST=true
      - ORTHANC_URL=http://pacs:8042
      - ORTHANC_USERNAME=quantum
      - ORTHANC_PASSWORD=quantum123
    depends_on:
      - app-db
      - pacs
    restart: always
    networks:
      - pacs

  nginx:
    image: nginx:alpine
    container_name: pacs-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_ohif.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL Certificates - Update these paths to match your VPS certificate location
      # Common path for Certbot: /etc/letsencrypt/live/yourdomain/fullchain.pem
      # Mapping the whole letsencrypt directory for convenience and to support symlinks
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    networks:
      - pacs
    depends_on:
      - frontend
      - pacs

networks:
  pacs:
    external: true
