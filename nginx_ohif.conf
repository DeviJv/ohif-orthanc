server {
  listen 80 default_server;
  listen [::]:80 default_server;

  client_max_body_size 500M;

  # DNS Resolver (Docker default)
  resolver 127.0.0.11 valid=30s;

  # Inject custom CSS
  sub_filter '</head>' '<link rel="stylesheet" href="/custom.css"></head>';
  sub_filter_once on;
  sub_filter_types text/html;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html htm;
    image/png               png;
    image/jpeg              jpeg jpg;
    image/svg+xml           svg;
    font/woff2              woff2;
    font/woff               woff;
    application/json        json;
  }

  location = /custom.css {
    root   /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # Orthanc Proxy - Direct and Simple
  location /orthanc/ {
    proxy_pass http://pacs:8042/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "Basic cXVhbnR1bTpxdWFudHVtMTIz"; 
    
    # Helpful for debugging
    add_header X-Proxied-To "pacs:8042" always;
  }

  # Main App
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  location = /service-worker.js {
    root   /usr/share/nginx/html;
    add_header Content-Type "application/javascript";
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri /service-worker.js;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
