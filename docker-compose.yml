services:
  # PostgreSQL for Orthanc/DICOM data
  backend-db:
    image: postgres:15-alpine
    container_name: backend-db
    restart: always
    environment:
      - POSTGRES_USER=${ORTHANC_USERNAME}
      - POSTGRES_PASSWORD=${ORTHANC_PASSWORD}
      - POSTGRES_DB=orthanc
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORTHANC_USERNAME} -d orthanc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pacs

  # PostgreSQL for Quantum Web app
  app-db:
    image: postgres:15-alpine
    container_name: app-db
    restart: always
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./app_postgres_data:/var/lib/postgresql/data
    networks:
      - pacs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Orthanc DICOM Server (renamed from 'pacs' to 'backend')
  backend:
    container_name: backend
    image: jodogne/orthanc-plugins
    ports:
      - 8042:8042
      - 4242:4242
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./auto-send.lua:/etc/orthanc/auto-send.lua:ro
      - ./ohif.js:/etc/orthanc/ohif.js:ro
      - ./ohif_custom.css:/etc/orthanc/ohif_custom.css:ro
      - ./orthanc_db:/var/lib/orthanc/db/
    restart: always
    depends_on:
      backend-db:
        condition: service_healthy
    environment:
      - FRONTEND_INTERNAL_URL=http://quantum-web:3001
    networks:
      - pacs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum -d orthanc"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Quantum Web Frontend (renamed from 'frontend' service, container 'pacs-web' to 'quantum-web')
  quantum-web:
    user: root
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: quantum-pacs-frontend:latest
    container_name: quantum-web
    volumes:
      - ./logo.png:/app/public/logo.png:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dicom-router:/app/dicom-router
    ports:
      - 3001:3001
    environment:
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@app-db:5432/${DB_NAME}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - ORTHANC_URL=http://backend:8042
      - ORTHANC_USERNAME=${ORTHANC_USERNAME}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
      - AI_BACKEND_URL=http://ai-engine:8000
      - INTERNAL_PACS_KEY=${INTERNAL_PACS_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NEXT_PUBLIC_ORTHANC_URL=${NEXT_PUBLIC_ORTHANC_URL}
    depends_on:
      - app-db
      - backend
    restart: always
    networks:
      - pacs

  # Nginx Gateway (unified - works for both local and VPS)
  nginx:
    image: nginx:alpine
    container_name: pacs-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logo.png:/usr/share/nginx/html/logo.png:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    networks:
      - pacs
    depends_on:
      - quantum-web
      - backend
      - viewer

  # OHIF Viewer (renamed from 'ohif-viewer' to 'viewer')
  viewer:
    image: ohif/app:v3.9.2
    container_name: viewer
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js
    networks:
      - pacs

  # Consolidated Backup System (Handles Orthanc, App DB, Cleaning, and Compression)
  backup-system:
    image: postgres:15-alpine
    container_name: backup-system
    restart: always
    environment:
      - PGPASSWORD=${ORTHANC_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/auto-backup.sh:/auto-backup.sh
    command: /auto-backup.sh
    depends_on:
      - backend-db
      - app-db
    networks:
      - pacs

  # AI Engine for medical image analysis
  ai-engine:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
      args:
        - BUILD_TYPE=lite # ganti lite atau full 
    container_name: ai-engine
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@app-db:5432/${DB_NAME}
      - ORTHANC_URL=http://backend:8042
      - ORTHANC_USERNAME=${ORTHANC_USERNAME}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
      - FRONTEND_INTERNAL_URL=http://quantum-web:3001
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./ai_models_cache/torch:/root/.cache/torch
      - ./ai_models_cache/torchxrayvision:/root/.torchxrayvision
    depends_on:
      - app-db
      - backend
    networks:
      - pacs
    ports:
      - "8000:8000"

networks:
  pacs:
    external: true
